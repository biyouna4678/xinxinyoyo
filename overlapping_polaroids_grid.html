                <!-- Overlapping Polaroids 2x2 小组件 -->
                <template x-if="cell.widgetType === 'overlapping_polaroids_2x2'">
                  <div class="w-full h-full flex items-center justify-center p-0 box-border overflow-hidden relative pointer-events-auto">
                    <div 
                      class="relative w-[148px] h-[148px] flex items-center justify-center"
                      x-data="{
                        frontImg: cell.data?.frontImg || 'https://i.ibb.co/zHfZgFxM/IMG-5521.jpg',
                        backImg: cell.data?.backImg || 'https://i.ibb.co/7tQkdZ7k/IMG-5520.jpg',
                        catImg: cell.data?.catImg || 'https://i.ibb.co/5X58mrNX/683-20260823010050.png',
                        caption: cell.data?.caption || 'soft day',
                        init() {
                          this.$watch('frontImg', val => this.syncData('frontImg', val));
                          this.$watch('backImg', val => this.syncData('backImg', val));
                          this.$watch('caption', val => this.syncData('caption', val));
                        },
                        syncData(key, value) {
                          if(!cell.data) cell.data = {};
                          cell.data[key] = value;
                        },
                        uploadFront() {
                          if (this.isEditing) return;
                          let input = document.createElement('input');
                          input.type = 'file';
                          input.accept = 'image/*';
                          input.onchange = (e) => {
                            let file = e.target.files[0];
                            if (file) {
                              this.frontImg = URL.createObjectURL(file);
                            }
                          };
                          input.click();
                        },
                        uploadBack() {
                          if (this.isEditing) return;
                          let input = document.createElement('input');
                          input.type = 'file';
                          input.accept = 'image/*';
                          input.onchange = (e) => {
                            let file = e.target.files[0];
                            if (file) {
                              this.backImg = URL.createObjectURL(file);
                            }
                          };
                          input.click();
                        }
                      }"
                    >
                      <!-- 1. 后方：淡粉色拍立得相框 -->
                      <div 
                        @click="isEditing ? null : uploadBack()"
                        title="点击更换后方图片"
                        class="absolute left-0 bottom-1 w-[96px] h-[132px] bg-[#fde2e8] rounded-[6px] border border-[#f9cbd6] shadow-xs p-1.5 flex flex-col justify-between cursor-pointer -rotate-6 hover:scale-105 transition-transform duration-200 z-0"
                      >
                        <!-- 左侧手绘星星装饰印花 -->
                        <div class="absolute left-1 top-4 text-[#f4abbb] text-[9px] pointer-events-none flex flex-col gap-3">
                          <span>☆</span>
                          <span class="text-[7px]">★</span>
                        </div>
                        <!-- 后方图像区域 -->
                        <div class="w-full h-[90px] rounded-[2px] overflow-hidden bg-[#fde2e8] mt-2">
                          <img :src="backImg" class="w-full h-full object-cover block" alt="Back Photo" />
                        </div>
                      </div>

                      <!-- 2. 前方：白色拍立得相框 -->
                      <div class="absolute right-0 top-0 w-[114px] h-[138px] bg-[#fcfcfc] rounded-[7px] border border-gray-200/90 shadow-[0_4px_16px_rgba(0,0,0,0.12)] p-1.5 flex flex-col justify-between z-10">
                        <!-- 顶部金属星星回形针 -->
                        <div class="absolute -top-2 left-4 w-5 h-7 z-30 pointer-events-none drop-shadow-xs">
                          <svg viewBox="0 0 24 32" fill="none" class="w-full h-full">
                            <path d="M7 10 L7 22 C7 25.5 10 28 13.5 28 C17 28 20 25.5 20 22 L20 6 C20 3.5 18 1.5 15.5 1.5 C13 1.5 11 3.5 11 6 L11 20" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
                            <path d="M15.5 1.5 L16.5 4 L19 4.5 L17 6.5 L17.5 9 L15.5 7.8 L13.5 9 L14 6.5 L12 4.5 L14.5 4 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
                          </svg>
                        </div>
                        <!-- 前方相片内容 -->
                        <div 
                          @click="isEditing ? null : uploadFront()"
                          title="点击更换前方图片"
                          class="w-full h-[94px] rounded-[2px] overflow-hidden bg-[#fcfcfc] cursor-pointer group mt-1"
                        >
                          <img :src="frontImg" class="w-full h-full object-cover block group-hover:scale-105 transition-transform duration-200" alt="Front Photo" />
                        </div>
                        <!-- 底部留白区域 -->
                        <div class="w-full h-[28px] flex items-center justify-start gap-1.5 px-0.5 pt-1">
                          <!-- 左侧手绘小猫图标 -->
                          <div class="w-5 h-[20px] flex-shrink-0 flex items-center justify-center">
                            <img :src="catImg" class="w-full h-full object-contain block" alt="Handdrawn Cat" />
                          </div>
                          <!-- 紧靠小猫右下方的文字与爱心组合包 -->
                          <div class="flex items-center gap-1.5 translate-y-[2px]">
                            <!-- 精简工整的英文文案 -->
                            <span 
                              :contenteditable="!isEditing"
                              @blur="caption = $el.innerText.trim()"
                              @keydown.enter.prevent="$el.blur()"
                              class="font-typewriter text-[10px] text-[#7B7B7B] tracking-tight outline-none cursor-text hover:bg-gray-100 rounded px-0.5 leading-none"
                              x-text="caption"
                            ></span>
                            <!-- 紧随其后的微型空心爱心 -->
                            <div class="text-[#7B7B7B] flex-shrink-0 flex items-center">
                              <svg class="w-2.5 h-2.5 fill-none stroke-[#7B7B7B]" stroke-width="1.8" viewBox="0 0 24 24">
                                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                              </svg>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
