                <!-- ins韩系音乐主页 4x2 小组件 -->
                <template x-if="cell.widgetType === 'ins_music_4x2'">
                  <div class="w-full h-full p-2 relative select-none">
                    <div 
                      class="w-full h-full rounded-[28px] striped-bg shadow-xl border border-white/80 relative p-3 flex flex-col justify-between overflow-hidden"
                      x-data="{
                        avatarImg: cell.data?.avatarImg || 'https://i.ibb.co/PzW40Ygr/IMG-5484.jpg',
                        playerImg: cell.data?.playerImg || 'https://i.ibb.co/F4JnrySg/IMG-5485.jpg',
                        nickname: cell.data?.nickname || 'Yosali',
                        username: cell.data?.username || '@onera2it',
                        followers: cell.data?.followers || '99k followers · 1 following',
                        mvTitle: cell.data?.mvTitle || '세상에 의미가 없어，너의 목소리가 들릴 헤드폰을 가져갈게',
                        currentDate: cell.data?.currentDate || '',
                        init() {
                          if (!this.currentDate) this.updateDate();
                          this.$watch('avatarImg', val => this.syncData('avatarImg', val));
                          this.$watch('playerImg', val => this.syncData('playerImg', val));
                          this.$watch('nickname', val => this.syncData('nickname', val));
                          this.$watch('username', val => this.syncData('username', val));
                          this.$watch('followers', val => this.syncData('followers', val));
                          this.$watch('mvTitle', val => this.syncData('mvTitle', val));
                          this.$watch('currentDate', val => this.syncData('currentDate', val));
                        },
                        syncData(key, value) {
                          if(!cell.data) cell.data = {};
                          cell.data[key] = value;
                        },
                        updateDate() {
                          const now = new Date();
                          const year = now.getFullYear();
                          const month = String(now.getMonth() + 1).padStart(2, '0');
                          const day = String(now.getDate()).padStart(2, '0');
                          this.currentDate = `${year}-${month}-${day}`;
                          this.syncData('currentDate', this.currentDate);
                        },
                        uploadAvatar() {
                          let input = document.createElement('input');
                          input.type = 'file';
                          input.accept = 'image/*';
                          input.onchange = (e) => {
                            let file = e.target.files[0];
                            if (file) {
                              this.avatarImg = URL.createObjectURL(file);
                            }
                          };
                          input.click();
                        },
                        uploadPlayerImg() {
                          let input = document.createElement('input');
                          input.type = 'file';
                          input.accept = 'image/*';
                          input.onchange = (e) => {
                            let file = e.target.files[0];
                            if (file) {
                              this.playerImg = URL.createObjectURL(file);
                            }
                          };
                          input.click();
                        }
                      }"
                    >
                      <!-- 顶部：博主信息区域 -->
                      <div class="flex items-center justify-between z-10 pt-0.5 px-1">
                        <!-- 左侧：头像 + 昵称与ID -->
                        <div class="flex items-center gap-2.5">
                          <div class="relative cursor-pointer group" @click="isEditing ? null : uploadAvatar()" title="点击更换博主头像">
                            <img :src="avatarImg" class="w-11 h-11 rounded-full object-cover border-2 border-white shadow-sm transition-transform duration-200 group-hover:scale-105" alt="Avatar" />
                            <div class="absolute -top-1.5 -right-1.5 bg-white border border-gray-100 shadow-sm rounded-full w-5 h-4 flex items-center justify-center">
                              <i class="fa-solid fa-music text-[8px] text-gray-700"></i>
                            </div>
                          </div>
                          <!-- 昵称、ID与粉丝数 -->
                          <div class="flex flex-col">
                            <h2 
                              :contenteditable="!isEditing"
                              @blur="nickname = $el.innerText.trim()"
                              @keydown.enter.prevent="$el.blur()"
                              class="text-[14px] font-extrabold text-gray-800 leading-none outline-none cursor-text hover:bg-black/5 rounded px-0.5"
                              x-text="nickname"
                            ></h2>
                            <span 
                              :contenteditable="!isEditing"
                              @blur="username = $el.innerText.trim()"
                              @keydown.enter.prevent="$el.blur()"
                              class="text-[10px] font-semibold text-gray-500 leading-tight mt-0.5 outline-none cursor-text hover:bg-black/5 rounded px-0.5"
                              x-text="username"
                            ></span>
                            <span 
                              :contenteditable="!isEditing"
                              @blur="followers = $el.innerText.trim()"
                              @keydown.enter.prevent="$el.blur()"
                              class="text-[9.5px] font-bold text-gray-500 leading-tight mt-0.5 outline-none cursor-text hover:bg-black/5 rounded px-0.5"
                              x-text="followers"
                            ></span>
                          </div>
                        </div>
                        <!-- 右侧：Edit 按钮 -->
                        <button class="bg-white/90 border border-gray-300 text-gray-800 text-[10px] font-bold px-2.5 py-0.5 rounded-full shadow-xs hover:bg-gray-50 active:scale-95 transition-all">
                          Edit
                        </button>
                      </div>

                      <!-- 底部：音乐播放器面板卡片 -->
                      <div class="bg-white/80 backdrop-blur-md rounded-[20px] p-2 flex items-center justify-between border border-white/60 shadow-sm z-10">
                        <div class="flex flex-col items-center flex-shrink-0 cursor-pointer group" @click="isEditing ? null : uploadPlayerImg()" title="点击更换播放器封面">
                          <div class="w-[85px] h-[48px] rounded-[10px] overflow-hidden border border-gray-100 shadow-xs">
                            <img :src="playerImg" class="w-full h-full object-cover transition-transform duration-200 group-hover:scale-105" alt="Player Image" />
                          </div>
                          <div class="flex items-center gap-1 text-[8.5px] text-gray-400 font-medium mt-1">
                            <i class="fa-regular fa-clock text-[8px]"></i>
                            <span>release</span>
                            <span x-text="currentDate"></span>
                          </div>
                        </div>
                        <div class="flex-1 flex flex-col justify-between pl-3 pr-1 h-[62px]">
                          <div class="flex items-center justify-between">
                            <span class="text-[11px] font-extrabold text-gray-700 tracking-wide">MV</span>
                            <i class="fa-solid fa-ellipsis-vertical text-gray-400 text-[10px] cursor-pointer hover:text-gray-600"></i>
                          </div>
                          <p 
                            :contenteditable="!isEditing"
                            @blur="mvTitle = $el.innerText.trim()"
                            @keydown.enter.prevent="$el.blur()"
                            class="text-[10px] font-bold text-gray-800 leading-tight line-clamp-2 outline-none cursor-text hover:bg-black/5 rounded px-0.5 transition-colors my-auto"
                            x-text="mvTitle"
                          ></p>
                          <div class="flex items-center justify-center gap-5 text-gray-800 text-[10px] pb-0.5">
                            <button class="hover:text-black active:scale-90 transition-transform"><i class="fa-solid fa-backward-step"></i></button>
                            <button class="hover:text-black active:scale-90 transition-transform"><i class="fa-solid fa-pause"></i></button>
                            <button class="hover:text-black active:scale-90 transition-transform"><i class="fa-solid fa-forward-step"></i></button>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
