                <!-- Pure Vinyl 2x2 小组件 -->
                <template x-if="cell.widgetType === 'pure_vinyl_2x2'">
                  <div class="w-full h-full flex items-center justify-center p-0 box-border overflow-hidden relative pointer-events-auto">
                    <div 
                      class="relative w-[158px] h-[158px] flex items-center justify-center"
                      x-data="{
                        coverImg: cell.data?.coverImg || 'https://i.ibb.co/ycJyfVC0/IMG-5506.jpg',
                        init() {
                          this.$watch('coverImg', val => this.syncData('coverImg', val));
                        },
                        syncData(key, value) {
                          if(!cell.data) cell.data = {};
                          cell.data[key] = value;
                        },
                        uploadCover() {
                          if (this.isEditing) return;
                          let input = document.createElement('input');
                          input.type = 'file';
                          input.accept = 'image/*';
                          input.onchange = (e) => {
                            let file = e.target.files[0];
                            if (file) {
                              this.coverImg = URL.createObjectURL(file);
                            }
                          };
                          input.click();
                        }
                      }"
                    >
                      <!-- 1. 旋转的黑胶唱片 -->
                      <div 
                        @click="isEditing ? null : uploadCover()"
                        title="点击更换封面图片"
                        class="absolute left-0 bottom-0 w-[138px] h-[138px] rounded-full bg-white/40 backdrop-blur-xs border border-white/90 shadow-[0_6px_20px_rgba(0,0,0,0.08)] flex items-center justify-center cursor-pointer relative spin-slow z-10"
                      >
                        <!-- 唱片圈层 1: 外圈玻璃质感 -->
                        <div class="absolute inset-1 rounded-full border border-pink-100/40"></div>
                        
                        <!-- 唱片圈层 2: 黑胶高光沟槽 -->
                        <div class="absolute inset-0 rounded-full vinyl-grooves pointer-events-none"></div>

                        <!-- 唱片圈层 3: 内圈粉白渐变盘面 -->
                        <div class="w-[92px] h-[92px] rounded-full border border-pink-200/50 bg-gradient-to-tr from-white/30 via-pink-50/20 to-white/40 flex items-center justify-center relative">
                          
                          <!-- 中心封面图 -->
                          <div class="w-[62px] h-[62px] rounded-full overflow-hidden border border-white/90 shadow-inner relative z-10">
                            <img :src="coverImg" class="w-full h-full object-cover" alt="Record Cover" />
                          </div>

                          <!-- 中心固定轴孔 -->
                          <div class="absolute w-3 h-3 rounded-full bg-white/80 border border-gray-200 shadow-xs z-20 pointer-events-none"></div>
                        </div>
                      </div>

                      <!-- 2. 白银配色唱臂 (按比例缩短长度，精确定位在唱片边缘) -->
                      <div class="absolute top-0 right-0 w-[50px] h-[132px] pointer-events-none z-20 drop-shadow-[2px_3px_3px_rgba(0,0,0,0.1)]">
                        <svg class="w-full h-full" viewBox="0 0 50 132" fill="none">
                          <defs>
                            <!-- 银色拉丝渐变 -->
                            <linearGradient id="silver-metal-widget" x1="0%" y1="0%" x2="100%" y2="0%">
                              <stop offset="0%" stop-color="#d1d5db" />
                              <stop offset="35%" stop-color="#ffffff" />
                              <stop offset="65%" stop-color="#e5e7eb" />
                              <stop offset="100%" stop-color="#9ca3af" />
                            </linearGradient>

                            <!-- 极小白色圆盘渐变 -->
                            <radialGradient id="white-disc-widget" cx="50%" cy="50%" r="50%">
                              <stop offset="0%" stop-color="#ffffff" />
                              <stop offset="70%" stop-color="#f8fafc" />
                              <stop offset="100%" stop-color="#e2e8f0" />
                            </radialGradient>
                          </defs>

                          <!-- A. 顶部缩小版底座垫圈 -->
                          <circle cx="32" cy="16" r="9.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

                          <!-- B. 顶部缩小版银盘 -->
                          <circle cx="32" cy="16" r="6.5" fill="url(#silver-metal-widget)" stroke="#ffffff" stroke-width="0.8" />
                          <!-- 内部微型 CD 纹 -->
                          <circle cx="32" cy="16" r="3.5" fill="url(#white-disc-widget)" stroke="#cbd5e1" stroke-width="0.5" />

                          <!-- C. 顶部微型分体金属阀 -->
                          <rect x="30" y="2" width="4" height="8" rx="1.5" fill="url(#silver-metal-widget)" stroke="#ffffff" stroke-width="0.5" />

                          <!-- D. 缩短后的金属唱臂杆 (路径重构：刚好落在唱片右侧盘面上) -->
                          <path d="M32 20 L32 88 L20 108" stroke="url(#silver-metal-widget)" stroke-width="2.2" stroke-linecap="round" />

                          <!-- E. 套管 -->
                          <rect x="30" y="19" width="4" height="5" rx="1" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5" />

                          <!-- F. 唱头 (刚好按压在唱片右下角表面) -->
                          <g transform="translate(20, 108) rotate(32)">
                            <rect x="-3.5" y="0" width="7" height="13" rx="1.2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
                            <rect x="-2" y="8.5" width="4" height="2" rx="0.5" fill="#9ca3af" />
                          </g>
                        </svg>
                      </div>
                    </div>
                  </div>
                </template>
