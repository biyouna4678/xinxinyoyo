      <!-- Pure Vinyl 2x2 小组件镜像 -->
      <template x-if="dragState.item.widgetType === 'pure_vinyl_2x2'">
        <div class="relative w-[158px] h-[158px] flex items-center justify-center pointer-events-none">
          <!-- 1. 旋转的黑胶唱片 -->
          <div class="absolute left-0 bottom-0 w-[138px] h-[138px] rounded-full bg-white/40 backdrop-blur-xs border border-white/90 shadow-[0_6px_20px_rgba(0,0,0,0.08)] flex items-center justify-center relative spin-slow z-10">
            <!-- 唱片圈层 1: 外圈玻璃质感 -->
            <div class="absolute inset-1 rounded-full border border-pink-100/40"></div>
            <!-- 唱片圈层 2: 黑胶高光沟槽 -->
            <div class="absolute inset-0 rounded-full vinyl-grooves"></div>
            <!-- 唱片圈层 3: 内圈粉白渐变盘面 -->
            <div class="w-[92px] h-[92px] rounded-full border border-pink-200/50 bg-gradient-to-tr from-white/30 via-pink-50/20 to-white/40 flex items-center justify-center relative">
              <!-- 中心封面图 -->
              <div class="w-[62px] h-[62px] rounded-full overflow-hidden border border-white/90 shadow-inner relative z-10">
                <img :src="dragState.item.data?.coverImg || 'https://i.ibb.co/ycJyfVC0/IMG-5506.jpg'" class="w-full h-full object-cover" />
              </div>
              <!-- 中心固定轴孔 -->
              <div class="absolute w-3 h-3 rounded-full bg-white/80 border border-gray-200 shadow-xs z-20"></div>
            </div>
          </div>
          <!-- 2. 白银配色唱臂 -->
          <div class="absolute top-0 right-0 w-[50px] h-[132px] z-20 drop-shadow-[2px_3px_3px_rgba(0,0,0,0.1)]">
            <svg class="w-full h-full" viewBox="0 0 50 132" fill="none">
              <!-- C. 顶部微型分体金属阀 -->
              <rect x="30" y="2" width="4" height="8" rx="1.5" fill="#e5e7eb" stroke="#ffffff" stroke-width="0.5" />
              <!-- D. 缩短后的金属唱臂杆 -->
              <path d="M32 20 L32 88 L20 108" stroke="#d1d5db" stroke-width="2.2" stroke-linecap="round" />
              <!-- E. 套管 -->
              <rect x="30" y="19" width="4" height="5" rx="1" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5" />
              <!-- F. 唱头 -->
              <g transform="translate(20, 108) rotate(32)">
                <rect x="-3.5" y="0" width="7" height="13" rx="1.2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
                <rect x="-2" y="8.5" width="4" height="2" rx="0.5" fill="#9ca3af" />
              </g>
            </svg>
          </div>
        </div>
      </template>
