                <!-- Creamy Film 2x4 小组件 -->
                <template x-if="cell.widgetType === 'creamy_film_2x4'">
                  <div class="w-full h-full flex items-center justify-center p-0 box-border overflow-hidden relative pointer-events-auto">
                    <div 
                      class="relative w-[148px] h-[260px] flex flex-col items-center justify-between py-2 px-1"
                      x-data="{
                        titleText: cell.data?.titleText || 'Sweet memories',
                        topImg: cell.data?.topImg || 'https://i.ibb.co/DZfs4JH/IMG-5540.jpg',
                        bottomImg: cell.data?.bottomImg || 'https://i.ibb.co/ymZ4Q1t8/IMG-5543.jpg',
                        starSticker: cell.data?.starSticker || 'https://i.ibb.co/FbVP5MHv/685-20260823014234.png',
                        init() {
                          this.$watch('titleText', val => this.syncData('titleText', val));
                          this.$watch('topImg', val => this.syncData('topImg', val));
                          this.$watch('bottomImg', val => this.syncData('bottomImg', val));
                        },
                        syncData(key, value) {
                          if(!cell.data) cell.data = {};
                          cell.data[key] = value;
                        },
                        uploadTop() {
                          if (this.isEditing) return;
                          let input = document.createElement('input');
                          input.type = 'file';
                          input.accept = 'image/*';
                          input.onchange = (e) => {
                            let file = e.target.files[0];
                            if (file) {
                              this.topImg = URL.createObjectURL(file);
                            }
                          };
                          input.click();
                        },
                        uploadBottom() {
                          if (this.isEditing) return;
                          let input = document.createElement('input');
                          input.type = 'file';
                          input.accept = 'image/*';
                          input.onchange = (e) => {
                            let file = e.target.files[0];
                            if (file) {
                              this.bottomImg = URL.createObjectURL(file);
                            }
                          };
                          input.click();
                        }
                      }"
                    >
                      <!-- 1. 提亮底板 -->
                      <div class="absolute inset-0 bg-gradient-to-b from-[#FFF0F3] to-[#FDEBEF] film-mask-holes z-0 pointer-events-none"></div>

                      <!-- 2. 顶部文案可内联编辑区域 -->
                      <div class="w-full h-[18px] flex items-center justify-center gap-1 mt-0.5 z-20 px-2">
                        <span 
                          :contenteditable="!isEditing"
                          x-text="titleText"
                          @blur="titleText = $el.innerText"
                          @keydown.enter.prevent="$el.blur()"
                          class="font-sweet text-[12px] text-[#E29CA9] font-bold tracking-tight leading-none cursor-text px-1 max-w-[100px] truncate transition-colors hover:bg-white/40 rounded outline-none"
                        ></span>
                        <svg class="w-2.5 h-2.5 fill-[#E29CA9] shrink-0" viewBox="0 0 24 24">
                          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                      </div>

                      <!-- 3. 上方照片槽 -->
                      <div 
                        @click="isEditing ? null : uploadTop()"
                        title="点击更换上方图片"
                        class="w-[116px] h-[92px] rounded-[3px] overflow-hidden bg-white cursor-pointer border border-[#FADCE3] group z-20"
                      >
                        <img :src="topImg" class="w-full h-full object-cover block group-hover:scale-105 transition-transform duration-200" />
                      </div>

                      <!-- 4. 下方照片槽 -->
                      <div 
                        @click="isEditing ? null : uploadBottom()"
                        title="点击更换下方图片"
                        class="w-[116px] h-[92px] rounded-[3px] overflow-hidden bg-white cursor-pointer border border-[#FADCE3] group z-20 mb-1"
                      >
                        <img :src="bottomImg" class="w-full h-full object-cover block group-hover:scale-105 transition-transform duration-200" />
                      </div>

                      <!-- 5. 右下角镭射星星贴纸 -->
                      <div class="absolute -bottom-1 -right-1 w-9 h-9 z-30 pointer-events-none drop-shadow-[0_2px_4px_rgba(255,182,193,0.4)]">
                        <img :src="starSticker" class="w-full h-full object-contain block" />
                      </div>
                    </div>
                  </div>
                </template>
